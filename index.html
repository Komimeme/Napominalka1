<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetroStudio — Pixel-Art Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="tv-case">
        
        <div class="tv-screen">
            <div class="crt-lines"></div>
            <div class="crt-static"></div>

            <header class="header">
                <h1 class="logo">✨ RETROSTUDIO ✨</h1>
                <p class="subtitle">СТУДИЯ ПИКСЕЛЬ АРТА - РАБОТАЕМ С 1980-ЫХ</p>
            </header>

            <div class="main-container">
                
                <div class="canvas-section">
                    <div class="canvas-wrapper">
                        <canvas id="pixelCanvas" width="400" height="400"></canvas>
                    </div>
                </div>

                <div class="controls-section">
                    
                    <div class="control-box">
                        <h2 class="box-title">ИНСТРУМЕНТЫ</h2>
                        <div class="tools-grid">
                            <button class="tool-btn active" id="tool-pencil" title="Карандаш">✏️</button>
                            <button class="tool-btn" id="tool-eraser" title="Ластик">🧽</button>
                            <button class="tool-btn" id="tool-bucket" title="Заливка">🪣</button>
                            <button class="tool-btn" id="tool-clear" title="Очистить всё">🗑️</button>
                        </div>
                    </div>

                    <div class="control-box">
                        <h2 class="box-title">ПАЛИТРА</h2>
                        <div class="palette-grid" id="palette">
                            </div>
                    </div>

                    <div class="features-box">
                        <h2 class="features-title">ФУНКЦИИ</h2>
                        <ul class="features-list">
                            <li>▪ СОЗДАВАЙ СПРАЙТЫ И АНИМАЦИИ</li>
                            <li>▪ СКАЧИВАЙ И ПЕРЕСЫЛАЙ ИЗОБРАЖЕНИЯ</li>
                            <li>▪ ВАЙБ НЕОНА 80-ЫХ</li>
                        </ul> 
                        <button id="downloadBtn" class="download-btn">
                            DOWNLOAD AS .PNG 💾
                        </button>
                    </div>
                </div>
            </div>
            <footer class="tv-footer">
                <div class="grille"></div>
                <div class="cartridge-slot" id="cartridgeSlot">
                    <span class="slot-text">INSERT CARTRIDGE</span>
                </div>
                <div class="grille"></div>
            </footer>

        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
